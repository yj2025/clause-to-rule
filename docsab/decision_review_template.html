<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정보배치 원문 매칭 검토</title>
<style>
/* 레이아웃: 위 요약 · 도구줄(고정) · 영역별 항목 카드(왼쪽 결정, 오른쪽 원문) · 맨 아래 남은 조항 */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#1b2129; --muted:#5b6573; --line:#dce0e6; --chip:#eceff3;
  --tos:#2c4f86; --tos-soft:#e6edf8; --man:#93561a; --man-soft:#f7ece0; --com:#4f5d6e; --com-soft:#eceff3;
  --hold:#a2441f; --hold-soft:#fbe9e1; --ok:#2f7a4f; --ok-soft:#e3f1e8; --kw:#6b4fa0; --kw-soft:#efe9f8;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --surface:#1b2027; --fg:#e4e8ee; --muted:#9aa4b1; --line:#2c333d; --chip:#252b34;
  --tos:#8fb0e6; --tos-soft:#1f2b3d; --man:#e0a868; --man-soft:#33261a; --com:#aab5c3; --com-soft:#252b34;
  --hold:#f0a07e; --hold-soft:#3a2219; --ok:#7fcf9f; --ok-soft:#1b2f24; --kw:#c3a8ef; --kw-soft:#2a2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1b2027; --fg:#e4e8ee; --muted:#9aa4b1; --line:#2c333d; --chip:#252b34;
  --tos:#8fb0e6; --tos-soft:#1f2b3d; --man:#e0a868; --man-soft:#33261a; --com:#aab5c3; --com-soft:#252b34;
  --hold:#f0a07e; --hold-soft:#3a2219; --ok:#7fcf9f; --ok-soft:#1b2f24; --kw:#c3a8ef; --kw-soft:#2a2238; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:18px}
h1{margin:0;font-size:1.5rem;line-height:1.3;text-wrap:balance}
h2{margin:8px 0 0;font-size:1.05rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:baseline}
.lede{margin:4px 0 0;color:var(--muted);max-width:80ch;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid}
.stat b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);align-items:center}
.bar{position:sticky;top:0;z-index:3;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:.75rem;color:var(--muted);margin-right:2px}
button{font:inherit;cursor:pointer}
.chipbtn{font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px}
.chipbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipbtn:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--tos);outline-offset:2px}
.act{font-size:.85rem;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:5px 12px}
.ghost{font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 12px}
input[type=search]{font:inherit;font-size:.88rem;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 200px;max-width:320px}
.area{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:minmax(260px,.9fr) 1.6fr;overflow:hidden}
.card.hold{border-color:var(--hold);box-shadow:inset 4px 0 0 var(--hold)}
.meta{padding:14px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line);min-width:0}
.meta h3{margin:0;font-size:1.02rem}
.meta .mean{font-size:.86rem;color:var(--muted);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.pill{font-size:.72rem;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.hold{background:var(--hold-soft);color:var(--hold)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.kw{background:var(--kw-soft);color:var(--kw)} .pill.none{background:var(--chip);color:var(--muted)}
.form{display:grid;gap:6px;background:var(--bg);border-radius:8px;padding:10px}
.form label{font-size:.75rem;color:var(--muted);display:grid;gap:3px}
.form select,.form textarea{font:inherit;font-size:.86rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.form textarea{min-height:56px;resize:vertical}
.form .prev{font-size:.72rem;color:var(--muted)}
.src{padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.sec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.sec.특약{box-shadow:inset 3px 0 0 var(--tos)} .sec.상품설명서{box-shadow:inset 3px 0 0 var(--man)}
.sec.공통약관,.sec.동의서{box-shadow:inset 3px 0 0 var(--com)}
.sec .h{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:.76rem;color:var(--muted)}
.sec .h b{color:var(--fg);font-size:.84rem}
.doc{font-size:.7rem;font-weight:700;border-radius:4px;padding:0 6px}
.doc.특약{background:var(--tos-soft);color:var(--tos)} .doc.상품설명서{background:var(--man-soft);color:var(--man)}
.doc.공통약관,.doc.동의서{background:var(--com-soft);color:var(--com)}
.sec pre{margin:4px 0 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--sans);font-size:.84rem;line-height:1.55;max-height:220px;overflow:auto}
.empty{color:var(--muted);font-style:italic;font-size:.88rem;margin:0}
.more{font-size:.8rem;border:0;background:none;color:var(--tos);padding:0;justify-self:start;text-decoration:underline}
.foot{font-size:.8rem;color:var(--muted)}
details.unused{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.unused summary{cursor:pointer;font-weight:600}
@media (max-width:820px){.card{grid-template-columns:1fr}.meta{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1 id="title"></h1><button class="ghost" id="theme" type="button">테마: 시스템</button></div>
    <p class="lede" id="lede"></p>
  </header>
  <section class="stats" id="stats" aria-label="요약"></section>
  <div class="legend">
    <span><span class="doc 특약">특약</span> <span class="doc 상품설명서">상품설명서</span> <span class="doc 공통약관">공통약관</span></span>
    <span><span class="pill ok">key 매칭</span> 팀 요약입력 key 로 붙인 원문</span>
    <span><span class="pill kw">낱말 검색</span> key 가 없어 낱말로 찾음 — 확인 필요</span>
    <span>역할: 주 = 그 항목의 주 근거 · 참고 = 다른 주제 조항 속 언급 · 공통 = 공통약관</span>
  </div>
  <div class="bar">
    <div class="row" id="filters" role="group" aria-label="보기"><span class="lab">보기</span></div>
    <div class="row">
      <input type="search" id="q" placeholder="항목 · 원문 낱말 찾기" aria-label="찾기">
      <button class="act" id="csv" type="button">결정 CSV 내려받기</button>
      <button class="ghost" id="json" type="button">JSON 내려받기</button>
      <button class="ghost" id="reset" type="button">입력 지우기</button>
      <span class="lab" id="saved"></span>
    </div>
  </div>
  <main id="list" style="display:grid;gap:12px"></main>
  <details class="unused" id="unusedBox"><summary id="unusedSum"></summary><div id="unused" style="display:grid;gap:8px;margin-top:10px"></div></details>
  <p class="foot" id="foot"></p>
</div>
<script>
const DATA = /*__DATA__*/null;
const KEY = "decision-review:" + DATA.product;
const DEC = ["", "확정", "제외", "보류 유지", "원본 확인 필요"];
const PRM = ["", "생존", "죽어"];
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
let filter = "hold";
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); document.getElementById("saved").textContent = "브라우저에 저장됨"; } catch (e) { document.getElementById("saved").textContent = "저장 안 됨 — 내려받기로 보관하세요"; } }
function el(tag, attrs = {}, ...kids){ const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  kids.forEach(c => c != null && e.append(c)); return e; }
const isHold = it => it.decision === "보류";
const cur = it => state[it.name] || (isHold(it) ? {decision: "", prompt: "", memo: ""} : {decision: it.decision, prompt: it.prompt.split("\n")[0], memo: ""});

function stats(){
  const I = DATA.items, s = document.getElementById("stats");
  const hold = I.filter(isHold);
  const doneHold = hold.filter(it => (state[it.name] || {}).decision).length;
  s.replaceChildren();
  [[String(I.length), "정보 항목"], [String(I.filter(i => i.sections.length).length), "원문이 붙은 항목"],
   [String(hold.length), "보류 항목"], [String(hold.filter(i => i.sections.length).length), "보류 중 원문 있음"],
   [`${doneHold}/${hold.length}`, "보류 결정 입력"]].forEach(([b, t]) => s.append(el("div", {class: "stat"}, el("b", {text: b}), el("span", {text: t}))));
}

function secBox(m){
  const b = el("div", {class: "sec " + m.doc});
  b.append(el("div", {class: "h"}, el("span", {class: "doc " + m.doc, text: m.doc}), el("b", {text: m.title}), el("span", {text: `§${m.id} · ${m.where}`}), el("span", {class: "pill", text: m.role})));
  b.append(el("pre", {text: m.text}));
  return b;
}

function card(it){
  const c = el("article", {class: "card" + (isHold(it) ? " hold" : ""), id: "it-" + it.name});
  const meta = el("div", {class: "meta"});
  meta.append(el("div", {class: "row"}, el("h3", {text: it.name}),
    el("span", {class: "pill " + (isHold(it) ? "hold" : ""), text: "현재 결정: " + (it.decision || "—")})));
  meta.append(el("p", {class: "mean", text: it.meaning}));
  const kv = el("dl", {class: "kv"});
  [["최초 출력", it.first_out + (it.first_how ? " — " + it.first_how : "")], ["추가 질문", it.ask + (it.ask_when ? " — " + it.ask_when : "")],
   ["상세보기", it.detail], ["프롬프트 입력", it.prompt.replace(/\n/g, " · ") || "—"], ["근거", it.basis || "—"]]
    .forEach(([k, v]) => { kv.append(el("dt", {text: k}), el("dd", {text: v || "—"})); });
  meta.append(kv);
  const v = cur(it), f = el("div", {class: "form"});
  const mk = (lab, opts, field) => { const s = el("select", {id: `${field}-${it.name}`});
    opts.forEach(o => s.append(el("option", {value: o, text: o || "— 선택 —"}))); s.value = v[field] || "";
    s.onchange = () => { state[it.name] = {...cur(it), [field]: s.value}; save(); stats(); }; return el("label", {}, lab, s); };
  f.append(mk("팀 결정", DEC, "decision"), mk("프론트 제외한 내용 프롬프트 입력", PRM, "prompt"));
  const ta = el("textarea", {id: `memo-${it.name}`, placeholder: "메모 (원문을 보고 판단한 이유 등)"}); ta.value = v.memo || "";
  ta.oninput = () => { state[it.name] = {...cur(it), memo: ta.value}; save(); };
  f.append(el("label", {}, "메모", ta));
  if (isHold(it)) f.append(el("div", {class: "prev", text: `표의 원래 값 — 결정: 보류 · 프롬프트: ${it.prompt.replace(/\n/g, " ") || "빈칸"}`}));
  meta.append(f);
  const src = el("div", {class: "src"});
  src.append(el("div", {class: "row"}, el("span", {class: "lab", text: "원문"}),
    el("span", {class: "pill " + (it.how === "key 매칭" ? "ok" : it.how === "낱말 검색" ? "kw" : "none"), text: it.how}),
    el("span", {class: "lab", text: it.sections.length ? `${it.sections.length}개 조항` : ""})));
  if (!it.sections.length) src.append(el("p", {class: "empty", text: "이 상품 원문에서 해당 내용을 찾지 못했습니다."}));
  const LIM = 4;
  it.sections.slice(0, LIM).forEach(m => src.append(secBox(m)));
  if (it.sections.length > LIM) { const rest = it.sections.slice(LIM); const btn = el("button", {class: "more", type: "button", text: `조항 ${rest.length}개 더 보기`});
    btn.onclick = () => { rest.forEach(m => src.insertBefore(secBox(m), btn)); btn.remove(); }; src.append(btn); }
  c.append(meta, src);
  return c;
}

function render(){
  const q = document.getElementById("q").value.trim();
  const L = document.getElementById("list"); L.replaceChildren();
  const pass = it => (filter === "all" || (filter === "hold" && isHold(it)) || (filter === "nosrc" && !it.sections.length) ||
    (filter === "kw" && it.how === "낱말 검색") || (filter === "open" && isHold(it) && !(state[it.name] || {}).decision)) &&
    (!q || (it.name + it.meaning + it.sections.map(s => s.text + s.title).join(" ")).includes(q));
  const items = DATA.items.filter(pass);
  if (!items.length) { L.append(el("p", {class: "empty", text: "조건에 맞는 항목이 없습니다. 다른 보기를 고르세요."})); return; }
  let area = null;
  items.forEach(it => { if (it.area !== area) { area = it.area; L.append(el("div", {class: "area", text: area})); } L.append(card(it)); });
}

function filters(){
  const F = document.getElementById("filters"); F.querySelectorAll("button").forEach(b => b.remove());
  [["hold", "보류만"], ["open", "보류 중 아직 결정 안 한 것"], ["all", "전체 49"], ["nosrc", "원문 없음"], ["kw", "낱말 검색 매칭"]]
    .forEach(([k, lab]) => { const b = el("button", {class: "chipbtn", type: "button", "aria-pressed": String(k === filter), text: lab});
      b.onclick = () => { filter = k; filters(); render(); }; F.append(b); });
}

function rows(){
  return DATA.items.map(it => { const v = cur(it); return {영역: it.area, 정보항목: it.name, 원래결정: it.decision, 원래프롬프트입력: it.prompt.replace(/\n/g, " "),
    검토결정: v.decision, 검토프롬프트입력: v.prompt, 메모: v.memo, 원문매칭: it.how, 원문조항: it.sections.map(s => `${s.doc}§${s.id}`).join(" ")}; });
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.getElementById("csv").onclick = () => {
  const R = rows(), H = Object.keys(R[0]);
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  download(`정보배치_검토_${DATA.product}.csv`, "﻿" + [H.map(esc).join(","), ...R.map(r => H.map(h => esc(r[h])).join(","))].join("\r\n"), "text/csv;charset=utf-8");
};
document.getElementById("json").onclick = () => download(`정보배치_검토_${DATA.product}.json`, JSON.stringify({product: DATA.product, rows: rows()}, null, 1), "application/json");
document.getElementById("reset").onclick = () => { if (!window.confirm || confirm("이 상품에서 입력한 결정 · 메모를 모두 지울까요?")) { state = {}; save(); stats(); render(); } };
document.getElementById("q").oninput = render;

const THEMES = [["system", "시스템"], ["light", "라이트"], ["dark", "다크"]];
let theme = "system"; try { theme = localStorage.getItem("decision-review-theme") || "system"; } catch (e) {}
function applyTheme(){ if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "테마: " + THEMES.find(t => t[0] === theme)[1]; }
document.getElementById("theme").onclick = () => { const i = THEMES.findIndex(t => t[0] === theme); theme = THEMES[(i + 1) % 3][0]; try { localStorage.setItem("decision-review-theme", theme); } catch (e) {} applyTheme(); };

document.title = `정보배치 원문 매칭 · ${DATA.product}`;
document.getElementById("title").textContent = `정보배치 원문 매칭 — ${DATA.product}`;
document.getElementById("lede").textContent = `«예금요약 서비스 정보배치 의사결정표»의 정보 항목 49개마다 이 상품(${DATA.category || ""})의 특약 · 상품설명서 · 공통약관 원문을 붙였습니다. 보류 항목은 결정 · 프롬프트 입력을 빈칸으로 두었습니다 — 원문을 보고 채운 뒤 CSV 로 내려받으세요. 입력은 이 브라우저에만 저장됩니다.`;
document.getElementById("foot").textContent = `원문: 팀 요약입력(${DATA.source.packets}) · 결정표: ${DATA.source.xlsx}. 낱말 검색 매칭은 자동이라 관련 없는 조항이 섞일 수 있습니다.`;
document.getElementById("unusedSum").textContent = `어느 항목에도 붙지 않은 이 상품의 조항 ${DATA.unused.length}개`;
DATA.unused.forEach(m => document.getElementById("unused").append(secBox(m)));
applyTheme(); filters(); stats(); render();
</script>
</body>
</html>
